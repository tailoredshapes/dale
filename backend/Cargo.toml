[package]
name = "dale-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
meshql-core = { path = "../../meshql-rs/meshql-core" }
meshql-mongo = { path = "../../meshql-rs/meshql-mongo" }
meshql-graphlette = { path = "../../meshql-rs/meshql-graphlette" }
meshql-restlette = { path = "../../meshql-rs/meshql-restlette" }
meshql-server = { path = "../../meshql-rs/meshql-server" }
meshql-lambda = { path = "../../meshql-rs/meshql-lambda" }
mongodb = "3"
lambda_http = "0.13"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
axum = "0.7"
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
