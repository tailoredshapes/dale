server {
    listen 80;
    server_name dale.poundit.co.uk;
    root /usr/share/nginx/html/site;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name dale-api.poundit.co.uk dale-admin-api.poundit.co.uk;
    location / {
        proxy_pass http://dale-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name dale-admin.poundit.co.uk;
    root /usr/share/nginx/html/web;
    index index.html;

    location = /config.js {
        default_type application/javascript;
        return 200 'window.DALE_CONFIG = { apiBase: "https://dale-api.poundit.co.uk", localAuth: true };';
    }

    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80 default_server;
    return 444;
}
