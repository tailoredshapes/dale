version: '3.8'

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.0
    environment:
      - SERVICES=ssm
      - DEBUG=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://localhost:4566/_localstack/health | grep -q running || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  dale-api:
    build:
      context: .
      dockerfile: local/Dockerfile
    environment:
      - TABLE_NAME=dale-local
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - SSM_ENDPOINT=https://localstack:4566
      - TELEGRAM_WEBHOOK_URL=http://localhost:3001
      - STRIPE_WEBHOOK_URL=http://localhost:3002
      - PAYPAL_WEBHOOK_URL=http://localhost:3003
      - PAYPAL_BASE_URL=https://api-m.sandbox.paypal.com
      - TELEGRAM_TEST_MODE=true
      - TELEGRAM_API_BASE_URL=http://localhost:3004
      - JWT_SECRET=local-test-secret-key-for-development
      - COGNITO_USER_POOL_ID=local-pool
    depends_on:
      dynamodb-local:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  setup:
    build:
      context: .
      dockerfile: local/Dockerfile
    command: ["node_modules/.bin/tsx", "local/setup.ts"]
    environment:
      - TABLE_NAME=dale-local
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - SSM_ENDPOINT=https://localstack:4566
    depends_on:
      dynamodb-local:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes: {}
