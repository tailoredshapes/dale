image: node:20

stages:
  - test
  - e2e
  - qa-review
  - deploy
  - smoke-test

variables:
  GIT_CLEAN_FLAGS: -ffdx -e e2e/node_modules -e node_modules

before_script:
  - source ~/.cargo/env 2>/dev/null || export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
  - git config --global url."http://oauth2:${GITLAB_TOKEN}@git.tildarc.com/tailoredshapes".insteadOf "https://git.tildarc.com/tailoredshapes"

test-backend:
  stage: test
  script:
    - docker run --rm -v "$(pwd)/e2e:/e2e" alpine sh -c "rm -rf /e2e/node_modules" 2>/dev/null || true
    - npm ci
    - npm test
  cache:
    key: dale-node-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

test-web:
  stage: test
  script:
    - cd web && npm ci && npx tsc --noEmit
  cache:
    key: dale-web-${CI_COMMIT_REF_SLUG}
    paths:
      - web/node_modules/

synth:
  stage: test
  script:
    - npm ci
    # Stub backend binary so CDK local bundling succeeds during synth (real build happens in e2e/deploy)
    - mkdir -p backend/target/release && printf '#!/bin/sh\necho stub' > backend/target/release/dale-backend && chmod +x backend/target/release/dale-backend
    - cd cdk && npm ci && cd ..
    - npx cdk synth -c env=dev
  cache:
    key: dale-node-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

e2e-local:
  stage: e2e
  tags:
    - shell
  needs:
    - test-backend
    - test-web
  cache:
    - key: "cargo-registry-v1"
      paths: [~/.cargo/registry/, ~/.cargo/git/]
      when: always
    - key:
        files: [backend/Cargo.lock]
        prefix: "dale-backend"
      paths: [backend/target/]
      when: always
  variables:
    COMPOSE_PROJECT_NAME: dale-${CI_JOB_ID}
  before_script:
    # Kill any leftover dale-work containers from local dev/agent runs that may hold ports
    - docker compose -p dale-work -f docker-compose.yml down -v 2>/dev/null || true
    - docker ps -q --filter "name=dale-work" | xargs -r docker rm -f || true
  script:
    # Clone meshql-rs dependencies (backend has local path deps)
    - |
      PARENT=$(dirname $(pwd))
      for repo in meshql-rs merkql merksql; do
        TARGET="$PARENT/$repo"
        if [ -d "$TARGET" ] && ! git -C "$TARGET" rev-parse --git-dir > /dev/null 2>&1; then
          echo "Removing corrupt/incomplete $repo directory"
          rm -rf "$TARGET"
        fi
        if [ ! -d "$TARGET" ]; then
          git clone http://gitlab-ci-token:${CI_JOB_TOKEN}@192.168.7.42:8929/tailoredshapes/$repo.git "$TARGET"
        else
          git -C "$TARGET" pull --ff-only || true
        fi
      done
    # Build meshql-rs backend binary before docker compose (Dockerfile copies pre-built binary)
    - |
      cd backend
      cargo build --release 2>&1 | tail -5
      cd ..
    # Start services (isolated by COMPOSE_PROJECT_NAME, no host port bindings)
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v 2>/dev/null || true
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

    # Wait for API to be healthy (service name dale-api, container name is project-prefixed)
    - |
      echo "Waiting for dale-api to be healthy..."
      API_CONTAINER="${COMPOSE_PROJECT_NAME}-dale-api-1"
      for i in $(seq 1 60); do
        if docker exec "$API_CONTAINER" curl -sf http://localhost:3000/health > /dev/null 2>&1; then
          echo "dale-api is healthy"
          break
        fi
        echo "Attempt $i/60 - waiting..."
        sleep 2
      done

    # Run E2E tests inside a container on the same network
    # Use Docker Compose service names for DNS (not container names)
    - |
      docker run --rm \
        --network ${COMPOSE_PROJECT_NAME}_default \
        -v $(pwd)/e2e:/app/e2e \
        -w /app/e2e \
        -e E2E_LOCAL_MODE=true \
        -e E2E_LOCAL_HOST=dale-api \
        -e DYNAMODB_ENDPOINT=http://dynamodb-local:8000 \
        -e SSM_ENDPOINT=http://localstack:4566 \
        node:20-alpine \
        sh -c "npm ci && npx cucumber-js --tags 'not @real-telegram and not @cognito-srp and not @tutorial and not @skip'"
  after_script:
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml logs || true
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v || true

gemini-qa:
  stage: qa-review
  tags:
    - shell
  needs:
    - e2e-local
  script:
    - bash scripts/gemini-review.sh
  allow_failure: true  # informational only

deploy-prod:
  stage: deploy
  tags:
    - shell
  only:
    - main
  needs:
    - e2e-local
  cache:
    - key: "cargo-registry-v1"
      paths: [~/.cargo/registry/, ~/.cargo/git/]
      policy: pull
    - key:
        files: [backend/Cargo.lock]
        prefix: "dale-backend"
      paths: [backend/target/]
      policy: pull
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    GOOGLE_CLIENT_ID: $GOOGLE_CLIENT_ID
    GOOGLE_CLIENT_SECRET: $GOOGLE_CLIENT_SECRET
  script:
    - npm ci
    # Clone meshql-rs deps and build backend binary for Lambda deployment
    - |
      PARENT=$(dirname $(pwd))
      for repo in meshql-rs merkql merksql; do
        TARGET="$PARENT/$repo"
        if [ -d "$TARGET" ] && ! git -C "$TARGET" rev-parse --git-dir > /dev/null 2>&1; then
          echo "Removing corrupt/incomplete $repo directory"
          rm -rf "$TARGET"
        fi
        if [ ! -d "$TARGET" ]; then
          git clone http://gitlab-ci-token:${CI_JOB_TOKEN}@192.168.7.42:8929/tailoredshapes/$repo.git "$TARGET"
        else
          git -C "$TARGET" pull --ff-only || true
        fi
      done
    # Build ARM64 binary for Lambda (cargo lambda cross-compiles correctly)
    - export PATH="$HOME/.cargo/bin:$PATH"
    - cd backend && cargo lambda build --release --arm64 && cd ..
    # Stage bootstrap where CDK tryBundle picks it up
    - cp backend/target/lambda/dale-backend/bootstrap backend/target/release/dale-backend
    - npx cdk deploy Dale-Prod -c env=prod --require-approval never --outputs-file cdk-outputs.json
    # Build + deploy SPA with prod URLs baked in
    - |
      WEB_BUCKET=$(python3 -c "import json; d=json.load(open('cdk-outputs.json')); print(d.get('Dale-Prod',{}).get('WebBucketName',''))")
      CF_DIST=$(python3 -c "import json; d=json.load(open('cdk-outputs.json')); print(d.get('Dale-Prod',{}).get('DistributionId',''))")
      cd web && npm ci
      VITE_USER_POOL_ID=$COGNITO_USER_POOL_ID \
      VITE_USER_POOL_CLIENT_ID=$COGNITO_CLIENT_ID \
      VITE_COGNITO_DOMAIN=dale-prod-890764614009.auth.us-east-1.amazoncognito.com \
      VITE_REDIRECT_SIGN_IN=https://dalegram.com/callback \
      VITE_REDIRECT_SIGN_OUT=https://dalegram.com/ \
      VITE_API_URL=$VITE_API_URL \
      npm run build
      cd ..
      aws s3 sync web/dist/ s3://$WEB_BUCKET/ --delete \
        --cache-control "public, max-age=31536000, immutable" --exclude "index.html"
      aws s3 cp web/dist/index.html s3://$WEB_BUCKET/index.html \
        --cache-control "no-cache, no-store, must-revalidate"
      [ -n "$CF_DIST" ] && aws cloudfront create-invalidation --distribution-id $CF_DIST --paths "/*" || true
    # Build + deploy sub-apps (admin, consumer, creator) with runtime config.js
    - bash scripts/deploy-sub-apps.sh cdk-outputs.json "$COGNITO_CLIENT_ID"
  artifacts:
    paths:
      - cdk-outputs.json
    expire_in: 1 hour

# ── Staging (on-demand, manual) ───────────────────────

staging-up:
  stage: deploy
  tags: [shell]
  needs:
    - gemini-qa
  when: manual
  script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - cd backend && cargo lambda build --release --arm64 && cd ..
    # Copy to target/release so CDK local bundling finds it at the expected path
    - cp backend/target/lambda/dale-backend/bootstrap backend/target/release/dale-backend
    - docker compose --profile staging up -d --build
    - echo "Staging is live at https://dale.poundit.co.uk"

staging-down:
  stage: deploy
  tags: [shell]
  rules:
    - when: manual
  script:
    - docker compose --profile staging down -v
    - echo "Staging is down"

# ── Smoke Tests ───────────────────────────────────────

smoke-test-prod:
  stage: smoke-test
  needs:
    - deploy-prod
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    STACK: Dale-Prod
  script:
    - npm ci
    - npx tsx scripts/smoke-test.ts
  only:
    - main

smoke-test-staging:
  stage: smoke-test
  tags: [shell]
  needs:
    - job: staging-up
      optional: true
  variables:
    SMOKE_SKIP_AUTH: "true"
    E2E_WEB_DISTRIBUTION_URL: https://dale.poundit.co.uk
    E2E_ADMIN_API_URL: https://dale-api.poundit.co.uk
  script:
    - npm ci
    - npx tsx scripts/smoke-test.ts
